<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G&S足迹回忆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,"Songti SC","SimSun",serif;}
body{display:flex;height:100vh;height:100dvh;overflow:hidden;background:#eef3f8;}

/* 左侧侧边栏 */
.sidebar{
  width:270px;
  background:linear-gradient(180deg,#fcfdff 0%,#f1f7fc 100%);
  padding:40px 22px 26px;
  border-right:1px solid #e3ecf5;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

/* 顶部品牌区（下方留出更多空间，让菜单按钮整体下移） */
.brand{text-align:center;margin-bottom:46px;}
.brand .logo{font-size:26px;font-weight:bold;color:#1a2533;letter-spacing:2px;}
.brand .line{width:36px;height:2px;background:#bcd6ec;margin:12px auto;}
.brand .tagline{font-size:12px;color:#9aa7b5;letter-spacing:2px;}

/* 菜单按钮 */
.menu-item{
  display:flex;align-items:center;gap:12px;
  margin-bottom:14px;
  padding:14px 16px;
  background:#fff;
  border:1px solid #dbe7f2;
  border-radius:12px;
  cursor:pointer;
  transition:all 0.25s ease;
}
.menu-item:hover{
  transform:translateX(4px);
  border-color:#bcd6ec;
  box-shadow:0 4px 12px rgba(60,110,160,0.10);
}
.menu-item.active{
  background:linear-gradient(90deg,#e9f4fd,#f5faff);
  border-color:#a9cdf0;
  box-shadow:0 4px 14px rgba(60,110,160,0.14);
}
.menu-item .icon{font-size:22px;line-height:1;}
.menu-item .cn{display:block;font-size:15px;font-weight:bold;color:#22354a;}
.menu-item .en{display:block;font-size:11px;color:#9aa7b5;letter-spacing:1.5px;margin-top:3px;}

/* 底部小字 */
.foot{
  margin-top:auto;
  padding-top:26px;
  text-align:center;
  font-size:11px;
  color:#b3c0cd;
  letter-spacing:1px;
}

/* 手机端：侧边栏变成顶部导航条，右侧内容占满剩余空间 */
@media(max-width:768px){
  body{flex-direction:column;}
  .sidebar{
    width:100%;
    flex-direction:row;
    align-items:stretch;
    gap:8px;
    padding:8px 10px;
    border-right:none;
    border-bottom:1px solid #e3ecf5;
    overflow-y:visible;
  }
  .brand, .foot{display:none;}
  .menu-item{
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    margin-bottom:0;
    padding:8px 2px;
    border-radius:10px;
    touch-action:manipulation;
  }
  .menu-item:hover{transform:none;box-shadow:none;}
  .menu-item .icon{font-size:18px;}
  .menu-item .cn{font-size:12px;}
  .menu-item .en{display:none;}
  .main{flex:1;min-height:0;}
}

/* 右侧内容区：每个板块一个 iframe，切换时只显示/隐藏、不重新加载，
   这样从详情页返回时，地图的缩放位置、列表的滚动位置都还是离开时的样子 */
.main{flex:1;position:relative;min-height:0;}
.panel{
  position:absolute;inset:0;
  width:100%;
  height:100%;
  border:none;
  background:#f5f8fb;
  -webkit-overflow-scrolling:touch;
  display:none;
}
.panel.show{display:block;}
</style>
</head>
<body>
<!-- 左侧菜单 -->
<div class="sidebar">
  <div class="brand">
    <div class="logo">G&S足迹回忆</div>
    <div class="line"></div>
    <div class="tagline">OUR FOOTPRINTS</div>
  </div>

  <div class="menu-item active" data-page="home.html">
    <span class="icon">🏠</span>
    <span class="txt"><span class="cn">主页</span><span class="en">HOME</span></span>
  </div>
  <div class="menu-item" data-page="food.html">
    <span class="icon">🍜</span>
    <span class="txt"><span class="cn">美食信息</span><span class="en">FOOD</span></span>
  </div>
  <div class="menu-item" data-page="fun.html">
    <span class="icon">🎮</span>
    <span class="txt"><span class="cn">娱乐信息</span><span class="en">FUN</span></span>
  </div>
  <div class="menu-item" data-page="map.html">
    <span class="icon">🗺️</span>
    <span class="txt"><span class="cn">回忆地图</span><span class="en">MAP</span></span>
  </div>

  <div class="foot">2021/09 <-> ??????</div>
</div>

<!-- 右侧内容区：各板块 iframe 常驻（首次点开才加载），商家详情页单独一个 iframe -->
<div class="main">
  <iframe class="panel show" id="f-home" src="home.html" data-src="home.html"></iframe>
  <iframe class="panel" id="f-food" data-src="food.html"></iframe>
  <iframe class="panel" id="f-fun" data-src="fun.html"></iframe>
  <iframe class="panel" id="f-map" data-src="map.html"></iframe>
  <iframe class="panel" id="f-detail"></iframe>
</div>

<script>
const menuItems = document.querySelectorAll('.menu-item');
const panels = document.querySelectorAll('.panel');
let currentPanel = document.getElementById('f-home');

// 切换页面的统一入口：侧边栏、主页入口卡片、商家详情页的返回键都会调用它
// 每个板块一个常驻 iframe，切换时只显示/隐藏、不重新加载，所以：
//   从详情页返回时，地图的缩放位置、美食/娱乐列表的滚动位置都还是离开时的样子
// fresh=true（侧边栏/主页入口点击）才强制重新加载，保证能看到最新数据
function navigate(page, fresh){
  const match = [...menuItems].find(m=>m.dataset.page===page);
  if(match){
    menuItems.forEach(m=>m.classList.toggle('active', m===match));
    const panel = document.getElementById('f-' + page.replace('.html',''));
    if(fresh || !panel.src || panel.src === 'about:blank'){
      panel.src = panel.dataset.src; // 已加载过的页面再赋同样的 src 也会强制刷新
    }
    showPanel(panel);
  } else {
    // 商家详情页等非菜单页面：在单独的 iframe 里打开，当前菜单高亮保持不变
    const detail = document.getElementById('f-detail');
    if(detail.src !== new URL(page, location.href).href){
      detail.src = page;
    }
    showPanel(detail);
  }
}

function showPanel(panel){
  panels.forEach(p=>p.classList.toggle('show', p===panel));
  if(panel !== currentPanel){
    currentPanel = panel;
    // 切换时的淡入过渡
    panel.style.animation = 'none';
    panel.offsetHeight; // 触发重排，让动画可以重复播放
    panel.style.animation = 'fadeIn 0.35s ease';
  }
}

menuItems.forEach(item=>{
  item.onclick = ()=>navigate(item.dataset.page, true);
});
window.navigate = navigate;

// 主页首次加载时的淡入过渡
document.getElementById('f-home').addEventListener('load', function(){
  this.style.animation = 'fadeIn 0.35s ease';
});
</script>
<style>
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
</style>
</body>
</html>

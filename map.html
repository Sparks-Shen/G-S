<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Georgia,"Songti SC","SimSun",serif;
  background:#f5f8fb;
}
.wrapper{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* 页头 */
.map-head{
  display:flex;align-items:baseline;gap:10px;
  padding:16px 24px 10px;
  background:#fff;
  border-bottom:1px solid #e7eef5;
}
h2{
  margin:0;
  font-size:22px;
  color:#1a2533;
  letter-spacing:1px;
}
.map-head .sub{font-size:13px;color:#9aa7b5;}
@media(max-width:768px){
  .map-head{padding:12px 14px 8px;}
}
#map{
  flex:1;
  width:100%;
}

/* 标记外层容器：大头像圆 + 底部红色指针 */
.pin-container{
  position: relative;
  width: 56px;
  height: 66px;
  transition: all 0.2s ease;
}

/* 圆形头像：白描边 + 红色外圈（大图裁切更宽容，主体不容易被切掉） */
.pin-circle{
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 3px solid #fff;
  overflow: hidden;
  z-index: 2;
  background: #eef2f6;
  box-shadow: 0 0 0 2px #e63946, 0 3px 10px rgba(0,0,0,0.28);
}

/* 圆形里的图片：绝对定位强制铺满圆形，取图片最中间区域，任何情况下都不会偏移留白 */
.pin-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

/* 底部红色指针小三角 */
.pin-point{
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 16px solid #e63946;
  z-index: 1;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
}

/* hover 整体放大置顶 */
.pin-container.hover{
  transform: scale(1.6);
  z-index: 9999 !important;
}

/* 悬浮黑底店名提示 */
.marker-tooltip{
  white-space: nowrap;
  background: #222;
  color: #fff;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 18px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="map-head">
    <h2>回忆地图</h2>
    <span class="sub">一起走过的地方</span>
  </div>
  <div id="map"></div>
</div>

<!-- 店铺配置文件 -->
<script src="shopData.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const mymap = L.map('map').setView([31.22, 121.46], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(mymap);

placeList.forEach(place=>{
  const customIcon = L.divIcon({
    className: "",
    html: `
    <div class="pin-container">
      <div class="pin-circle">
        <img class="pin-img" src="${place.img}?t=${Date.now()}" alt="${place.name}"
             style="object-position:${place.pos || '50% 50%'};">
      </div>
      <div class="pin-point"></div>
    </div>
    `,
    iconSize: [56, 66],
    iconAnchor: [28, 66]
  })
  const marker = L.marker([place.lat, place.lng], {icon: customIcon}).addTo(mymap);

  // 头像图片加载失败时，用店名首字代替，避免出现裂图图标
  const pinImg = marker._icon.querySelector('.pin-img');
  pinImg.onerror = ()=>{
    const fallback = document.createElement('span');
    fallback.textContent = place.name.charAt(0);
    fallback.style.cssText = 'display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#8a97a6;background:#eef2f6;';
    pinImg.replaceWith(fallback);
  };

  // 鼠标悬浮显示店名
  marker.bindTooltip(place.name, {
    className: "marker-tooltip",
    permanent: false,
    offset: [0, -64]
  })

  // 点击在右侧内容区打开详情页，侧边栏保持不动
  marker.on('click', function(){
    if(parent.navigate){ parent.navigate(place.link); }
    else { window.open(place.link, "_blank"); }
  })

  // hover 放大置顶
  marker.on('mouseover', function () {
    this._icon.querySelector('.pin-container').classList.add('hover');
  });
  marker.on('mouseout', function () {
    this._icon.querySelector('.pin-container').classList.remove('hover');
  })
})
</script>
</body>
</html>
